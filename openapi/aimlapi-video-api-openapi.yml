                    - bytedance/dreamina-seedance-2-0-mini
                    - bytedance/seedance-2-0-fast
                    - bytedance/seedance-2.0/fast/image-to-video
                    - bytedance/seedance-2.0/fast/reference-to-video
                    - bytedance/seedance-2.0/fast/text-to-video
                    - bytedance/seedance-2-0-mini
                  provider:
                    type: string
                    description: Provider routing override, pinning the request to one provider and disabling fallback. `auto` (default) uses the full Tencent Cloud VOD -> native ByteDance -> fal.ai chain. `tencent_vod` is the only provider that accepts reference images containing real people (it registers them as assets first); pinning `bytedance` or `fal` sends the images straight to a provider that rejects them with "the input image may contain real person". Case-insensitive.
                    example: auto
                  prompt:
                    type: string
                    description: The text description of the scene, subject, or action to generate in the video.
