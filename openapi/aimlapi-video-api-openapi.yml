                    description: Varying the seed integer is a way to get different results for the same other request parameters. Using the same value for an identical request will produce similar results. If unspecified, a random number is chosen.
                  watermark:
                    type: boolean
                    default: false
                    description: Whether the video contains a watermark.
                required:
                - model
                - prompt
                title: bytedance/dreamina-seedance-2-0-fast, bytedance/dreamina-seedance-2-0-mini, bytedance/seedance-2-0-fast, bytedance/seedance-2.0/fast/image-to-video, bytedance/seedance-2.0/fast/reference-to-video, bytedance/seedance-2.0/fast/text-to-video, bytedance/seedance-2-0-mini
              - type: object
                properties:
                  model:
                    type: string
                    enum:
                    - bytedance/dreamina-seedance-2-5
                    - bytedance/seedance-2-5
                    - bytedance/seedance-2.5
                  provider:
                    type: string
                    description: Provider routing override, pinning the request to one provider and disabling fallback. Seedance 2.5 runs on native ByteDance only, so `auto` (default) and `bytedance` behave identically today. Unlike Seedance 2.0 there is no Tencent Cloud VOD link, so reference images containing real people are rejected upstream. Case-insensitive.
