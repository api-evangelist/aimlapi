                    format: uri
                    description: URL, Base64-encoded string or asset ID of the audio. The duration of the audio file specified in the parameter must not exceed 15.2 seconds. If audio is provided, at least one reference image or video is required.
                  video_url:
                    type: string
                    format: uri
                    description: The public URL of the video. Only video URLs are supported.
                  image_urls:
                    type: array
                    items:
                      type: string
                      format: uri
                    minItems: 1
                    maxItems: 9
                    description: Reference images to guide video generation. Refer to them in the prompt as @Image1, @Image2, etc.
                  audio_urls:
                    type: array
                    items:
                      type: string
                      format: uri
                    minItems: 1
                    maxItems: 3
                    description: 'Reference audio to guide video generation. Refer to them in the prompt as @Audio1, @Audio2, etc. Supported formats: MP3, WAV. Up to 3 files, combined duration must not exceed 15 seconds. If audio is provided, at least one reference image (image_urls) or video (video_urls) is required.'
                  video_urls:
