                    - '1:1'
                    - '3:4'
                    - '9:16'
                    default: '16:9'
                    description: 'The aspect ratio of the generated video. Defaults to 16:9 for text-to-video and reference-to-video requests. Must be omitted for first-frame / first-last-frame generation (`image_url`): the output aspect ratio follows the input image.'
                  resolution:
