                  - '#g1_nova-2-video'
                  - nova-2-medical
                  - deepgram/nova-2-medical
                  - '#g1_nova-2-medical'
                  - nova-2-drivethru
                  - deepgram/nova-2-drivethru
                  - '#g1_nova-2-drivethru'
                  - nova-2-automotive
                  - deepgram/nova-2-automotive
                  - '#g1_nova-2-automotive'
                  - nova-3
                  - deepgram/nova-3
                  - '#g1_nova-3'
                  - nova-3-general
                  - deepgram/nova-3-general
                  - '#g1_nova-3-general'
                  - nova-3-medical
                  - deepgram/nova-3-medical
                  - '#g1_nova-3-medical'
                  - whisper-large
                  - deepgram/whisper-large
                  - '#g1_whisper-large'
                  - whisper-medium
                  - deepgram/whisper-medium
                  - '#g1_whisper-medium'
                  - whisper-small
                  - deepgram/whisper-small
                  - '#g1_whisper-small'
