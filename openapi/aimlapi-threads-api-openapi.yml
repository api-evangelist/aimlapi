openapi: 3.0.0
info:
  title: AIMLAPI AI/ML API Documentation API Key Management Threads API
  description: "=K Welcome to the [AI/ML API](https://aimlapi.com/) docs! AI/ML API makes integrating state-of-the-art AI models into your applications effortless, offering seamless compatibility with OpenAI-like interfaces.\n\n**Features Include:**\n\n- **Inference**: Easily evaluate models for text, images, and more using our API.\n    \n- **API Key Management**: Securely manage your API keys for controlled access.\n    \n- **Broad Model Selection**: Access a diverse range of models for various AI tasks.\n    \n\nSee Quickstart"
  version: 1.0.0
servers:
- url: http://{{baseurl}}
security:
- bearerAuth: []
tags:
- name: Threads
paths:
  /threads:
    post:
      tags:
      - Threads
      summary: AIMLAPI Create Thread
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                messages:
                - role: user
                  content: What are you doing?
                metadata: {}
      responses:
        '201':
          description: Created
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '*'
            Content-Length:
              schema:
                type: integer
                example: '101'
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Date:
              schema:
                type: string
                example: Wed, 24 Apr 2024 07:37:56 GMT
            Etag:
              schema:
                type: string
                example: W/"65-ZMUAEplUbih0VY/ucxJH7zy5Kdo"
            X-Powered-By:
              schema:
                type: string
                example: Express
          content:
            application/json:
              schema:
                type: object
              example:
                id: 3a06d500-08fc-428e-862e-9a09099bf4c3
                object: thread
                created_at: 1713944276
                metadata: {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
