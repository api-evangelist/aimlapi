openapi: 3.2.0
info:
  title: AIML Tts API
  version: 1.0.0
servers:
- url: https://api.aimlapi.com
tags:
- name: TTS
paths:
  /v1/tts:
    post:
      operationId: _v1_tts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                properties:
                  model:
                    type: string
                    enum:
                    - gpt-4o-mini-tts
                    - openai/gpt-4o-mini-tts
                    - tts-1
                    - openai/tts-1
                    - tts-1-hd
                    - openai/tts-1-hd
                  text:
                    type: string
                    minLength: 1
                    maxLength: 4096
                    description: The text content to be converted to speech.
                  voice:
                    type: string
                    enum:
                    - alloy
                    - ash
                    - ballad
                    - coral
                    - echo
                    - fable
                    - nova
                    - onyx
                    - sage
                    - shimmer
                    - verse
                    default: alloy
                    description: Name of the voice to be used.
                  style:
                    type: string
                    description: Determines the style exaggeration of the voice. This setting attempts to amplify the style of the original speaker. It does consume additional computational resources and might increase latency if set to anything other than 0.
                  response_format:
                    type: string
                    enum:
                    - mp3
                    - opus
                    - aac
                    - flac
                    - wav
                    - pcm
                    default: mp3
                    description: Format of the output content for non-streaming requests. Controls how the generated audio data is encoded in the response.
                  speed:
                    type: number
                    minimum: 0.25
                    maximum: 4
                    default: 1
                    description: Adjusts the speed of the voice. A value of 1.0 is the default speed, while values less than 1.0 slow down the speech, and values greater than 1.0 speed it up.
                  stream:
                    type: boolean
                    enum:
                    - false
                    default: false
                required:
                - model
                - text
                title: gpt-4o-mini-tts, openai/gpt-4o-mini-tts, tts-1, openai/tts-1, tts-1-hd, openai/tts-1-hd
              - type: object
                properties:
                  model:
                    type: string
                    enum:
                    - bytedance/seed-audio-1-0
                    - bytedance/seed-audio-1.0
                  text:
                    type: string
                    minLength: 1
                    maxLength: 3000
                    description: Text to synthesize (the TTS prompt). Use @Audio1, @Audio2, etc. to reference audio clips.
                  references:
                    type: array
                    items:
                      type: object
                      properties:
                        speaker:
                          type: string
                          description: BytePlus TTS2.0 voice ID or cloned voice ID.
                        audio_data:
                          type: string
                          description: Base64-encoded reference audio.
                        audio_url:
                          type: string
                          format: uri
                          description: URL of a reference audio file.
                        image_data:
                          type: string
                          description: Base64-encoded reference image.
                        image_url:
                          type: string
                          format: uri
                          description: URL of a reference image.
                    maxItems: 3
                    description: Reference resources. Supports up to three audio references or one image reference.
                  audio_config:
                    type: object
                    properties:
                      format:
                        type: string
                        enum:
                        - wav
                        - mp3
                        - pcm
                        - ogg_opus
                        default: wav
                        description: The format of the generated music.
                      sample_rate:
                        anyOf:
                        - type: string
                          enum:
                          - '8000'
                          - '16000'
                          - '24000'
                          - '32000'
                          - '44100'
                          - '48000'
                        - type: integer
                        description: The sampling rate of the generated music.
                        enum:
                        - 8000
                        - 16000
                        - 24000
                        - 32000
                        - 44100
                        - 48000
                      speech_rate:
                        type: integer
                        minimum: -50
                        maximum: 100
                        default: 0
                        description: Speech rate. 100 means 2.0x speed, -50 means 0.5x speed.
                      loudness_rate:
                        type: integer
                        minimum: -50
                        maximum: 100
                        default: 0
                        description: Volume. 100 means 2.0x volume, -50 means 0.5x volume.
                      pitch_rate:
                        type: integer
                        minimum: -12
                        maximum: 12
                        default: 0
                        description: Pitch adjustment.
                  watermark:
                    type: object
                    properties:
                      aigc_watermark:
                        type: boolean
                        default: false
                        description: Adds an explicit audio rhythm marker.
                      aigc_metadata:
                        type: object
                        properties:
                          enable:
                            type: boolean
                            default: false
                          content_producer:
                            type: string
                          produce_id:
                            type: string
                          content_propagator:
                            type: string
                          propagate_id:
                            type: string
                        description: Implicit watermark metadata.
                required:
                - model
                - text
                title: bytedance/seed-audio-1-0, bytedance/seed-audio-1.0
              - type: object
                properties:
                  model:
                    type: string
                    enum:
                    - elevenlabs/eleven_multilingual_v2
                    - elevenlabs/eleven_turbo_v2_5
                  text:
                    type: string
                    description: The text content to be converted to speech.
                  voice:
                    type: string
                    enum:
                    - Rachel
                    - Bella
                    - Roger
                    - Sarah
                    - Laura
                    - Charlie
                    - George
                    - Callum
                    - River
                    - Harry
                    - Liam
                    - Alice
                    - Matilda
                    - Will
                    - Jessica
                    - Eric
                    - Chris
                    - Brian
                    - Daniel
                    - Lily
                    - Adam
                    - Bill
                    - Drew
                    - Clyde
                    - Paul
                    - Aria
                    - Domi
                    - Dave
                    - Fin
                    - Antoni
                    - Thomas
                    - Emily
                    - Elli
                    - Patrick
                    - Dorothy
                    - Josh
                    - Charlotte
                    - James
                    - Joseph
                    - Jeremy
                    - Michael
                    - Ethan
                    - Gigi
                    - Freya
                    - Grace
                    - Serena
                    - Nicole
                    - Jessie
                    - Sam
                    - Glinda
                    - Giovanni
                    - Mimi
                    default: Rachel
                    description: Name of the voice to be used.
                  apply_text_normalization:
                    type: string
                    enum:
                    - auto
                    - 'on'
                    - 'off'
                    description: 'This parameter controls text normalization with three modes: ''auto'', ''on'', and ''off''. When set to ''auto'', the system will automatically decide whether to apply text normalization (e.g., spelling out numbers). With ''on'', text normalization will always be applied, while with ''off'', it will be skipped.'
                  output_format:
                    type: string
                    enum:
                    - mp3_22050_32
                    - mp3_44100_32
                    - mp3_44100_64
                    - mp3_44100_96
                    - mp3_44100_128
                    - mp3_44100_192
                    - pcm_8000
                    - pcm_16000
                    - pcm_22050
                    - pcm_24000
                    - pcm_44100
                    - pcm_48000
                    - ulaw_8000
                    - alaw_8000
                    - opus_48000_32
                    - opus_48000_64
                    - opus_48000_96
                    - opus_48000_128
                    - opus_48000_192
                    description: Format of the output content for non-streaming requests. Controls how the generated audio data is encoded in the response.
                  voice_settings:
                    type: object
                    properties:
                      stability:
                        type: number
                        minimum: 0
                        maximum: 1
                        default: 0.5
                        description: Determines how stable the voice is and the randomness between each generation. Lower values introduce broader emotional range for the voice. Higher values can result in a monotonous voice with limited emotion.
                      use_speaker_boost:
                        type: boolean
                        default: true
                        description: This setting boosts the similarity to the original speaker. Using this setting requires a slightly higher computational load, which in turn increases latency.
                      similarity_boost:
                        type: number
                        minimum: 0
                        maximum: 1
                        default: 0.75
                        description: Determines how closely the AI should adhere to the original voice when attempting to replicate it.
                      style:
                        type: number
                        minimum: 0
                        maximum: 1
                        default: 0
                        description: Determines the style exaggeration of the voice. This setting attempts to amplify the style of the original speaker. It does consume additional computational resources and might increase latency if set to anything other than 0.
                      speed:
                        type: number
                        minimum: 0.7
                        maximum: 1.2
                        default: 1
                        description: Adjusts the speed of the voice. A value of 1.0 is the default speed, while values less than 1.0 slow down the speech, and values greater than 1.0 speed it up.
                    description: Voice settings overriding stored settings for the given voice. They are applied only on the given request.
                  seed:
                    type: integer
                    description: If specified, our system will make a best effort to sample deterministically, such that repeated requests with the same seed and parameters should return the same result. Determinism is not guaranteed.
                  stream:
                    type: boolean
                    default: true
                  next_text:
                    type: string
                    description: The text that comes after the text of the current request. Can be used to improve the speech's continuity when concatenating together multiple generations or to influence the speech's continuity in the current generation.
                  previous_text:
                    type: string
                    description: The text that came before the text of the current request. Can be used to improve the speech's continuity when concatenating together multiple generations or to influence the speech's continuity in the current generation.
                required:
                - model
                - text
                title: elevenlabs/eleven_multilingual_v2, elevenlabs/eleven_turbo_v2_5
              - type: object
                properties:
                  model:
                    type: string
                    enum:
                    - elevenlabs/v3_alpha
                  text:
                    type: string
                    description: The text content to be converted to speech.
                  voice:
                    type: string
                    enum:
                    - Rachel
                    - Bella
                    - Roger
                    - Sarah
                    - Laura
                    - Charlie
                    - George
                    - Callum
                    - River
                    - Harry
                    - Liam
                    - Alice
                    - Matilda
                    - Will
                    - Jessica
                    - Eric
                    - Chris
                    - Brian
