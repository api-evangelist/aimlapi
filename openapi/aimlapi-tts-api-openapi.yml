                    - Greek
                    - Czech
                    - Finnish
                    - Hindi
                    - Bulgarian
                    - Danish
                    - Hebrew
                    - Malay
                    - Persian
                    - Slovak
                    - Swedish
                    - Croatian
                    - Filipino
                    - Hungarian
                    - Norwegian
                    - Slovenian
                    - Catalan
                    - Nynorsk
                    - Tamil
                    - Afrikaans
                    - auto
                    description: Language recognition enhancement option.
                  voice_modify:
                    type: object
                    properties:
                      pitch:
                        type: integer
                        minimum: -100
                        maximum: 100
                        description: Pitch level (-100 to 100)
                      intensity:
                        type: integer
                        minimum: -100
                        maximum: 100
                        description: Intensity level (-100 to 100)
                      timbre:
                        type: integer
                        minimum: -100
                        maximum: 100
                        description: Timbre level (-100 to 100)
                      sound_effects:
                        type: string
                        enum:
                        - spacious_echo
                        - auditorium_echo
                        - lofi_telephone
                        - robotic
                        description: Audio effects to apply to the synthesized speech. Includes options like spacious_echo, auditorium_echo, lofi_telephone, and robotic effects.
                    description: Voice modification settings for adjusting pitch, intensity, timbre, and applying sound effects to customize the voice characteristics.
                  subtitle_enable:
                    type: boolean
                    default: false
                    description: Enable subtitle generation service. Only available for non-streaming requests. Generates timing information for the synthesized speech.
                  stream:
                    type: boolean
                    enum:
                    - false
                    default: false
                required:
                - model
                - text
                title: minimax/speech-2.5-turbo-preview, minimax/speech-2.5-hd-preview, minimax/speech-2.6-hd, minimax/speech-2.6-turbo, minimax/speech-2.8-turbo, minimax/speech-2.8-hd
              - type: object
                properties:
                  model:
                    type: string
                    enum:
                    - aura
                    - deepgram/aura
                    - aura-asteria-en
                    - deepgram/aura-asteria-en
                    - '#g1_aura-asteria-en'
                    - aura-hera-en
                    - deepgram/aura-hera-en
                    - '#g1_aura-hera-en'
                    - aura-luna-en
                    - deepgram/aura-luna-en
                    - '#g1_aura-luna-en'
                    - aura-stella-en
