                    - Dave
                    - Fin
                    - Antoni
                    - Thomas
                    - Emily
                    - Elli
                    - Patrick
                    - Dorothy
                    - Josh
                    - Charlotte
                    - James
                    - Joseph
                    - Jeremy
                    - Michael
                    - Ethan
                    - Gigi
                    - Freya
                    - Grace
                    - Serena
                    - Nicole
                    - Jessie
                    - Sam
                    - Glinda
                    - Giovanni
                    - Mimi
                    default: Rachel
                    description: Name of the voice to be used.
                  apply_text_normalization:
                    type: string
                    enum:
                    - auto
