                        maximum: 1.2
                        default: 1
                        description: Adjusts the speed of the voice. A value of 1.0 is the default speed, while values less than 1.0 slow down the speech, and values greater than 1.0 speed it up.
                    description: Voice settings overriding stored settings for the given voice. They are applied only on the given request.
                  seed:
                    type: integer
                    description: If specified, our system will make a best effort to sample deterministically, such that repeated requests with the same seed and parameters should return the same result. Determinism is not guaranteed.
                  stream:
                    type: boolean
                    default: true
                required:
                - model
                - text
                title: elevenlabs/v3_alpha
              - type: object
                properties:
                  model:
                    type: string
                    enum:
                    - qwen3-tts-flash
                    - alibaba/qwen3-tts-flash
                  text:
                    type: string
                    minLength: 1
                    maxLength: 600
                    description: The text content to be converted to speech.
                  voice:
                    type: string
                    enum:
                    - Cherry
                    - Ethan
                    - Nofish
                    - Jennifer
                    - Ryan
                    - Katerina
                    - Elias
                    - Jada
                    - Dylan
                    - Sunny
                    - Li
                    - Marcus
                    - Roy
                    - Peter
                    - Rocky
                    - Kiki
                    - Eric
                    default: Cherry
                    description: Name of the voice to be used.
                  stream:
                    type: boolean
                    enum:
                    - false
                    default: false
                required:
                - model
                - text
                title: qwen3-tts-flash, alibaba/qwen3-tts-flash
              - type: object
                properties:
                  model:
                    type: string
                    enum:
                    - test/dummy-tts
                  text:
                    type: string
                    minLength: 1
                    maxLength: 4096
                  voice:
                    type: string
                    default: alloy
                  response_format:
                    type: string
                    enum:
                    - mp3
                    - opus
                    - aac
                    - flac
                    - wav
                  stream:
                    type: boolean
                    enum:
                    - false
                    default: false
                  test:
                    type: object
                    properties:
                      delay:
                        type: number
                      errorStatus:
                        type: number
                required:
                - model
                - text
                title: test/dummy-tts
              - type: object
                properties:
                  model:
                    type: string
                    enum:
                    - minimax/speech-2.5-turbo-preview
                    - minimax/speech-2.5-hd-preview
                    - minimax/speech-2.6-hd
                    - minimax/speech-2.6-turbo
                    - minimax/speech-2.8-turbo
                    - minimax/speech-2.8-hd
                  text:
                    type: string
                    minLength: 1
                    maxLength: 5000
                    description: The text content to be converted to speech.
                  voice_setting:
                    type: object
                    properties:
                      voice_id:
                        anyOf:
                        - type: string
                          enum:
                          - Wise_Woman
                          - Friendly_Person
                          - Inspirational_girl
                          - Deep_Voice_Man
                          - Calm_Woman
                          - Casual_Guy
                          - Lively_Girl
                          - Patient_Man
                          - Young_Knight
                          - Determined_Man
                          - Lovely_Girl
                          - Decent_Boy
                          - Imposing_Manner
                          - Elegant_Man
                          - Abbess
                          - Sweet_Girl_2
                          - Exuberant_Girl
                        - type: string
                          minLength: 1
                          maxLength: 64
                        default: Wise_Woman
                        description: A predefined system voice for text-to-speech synthesis.
                      speed:
                        type: number
                        minimum: 0.5
                        maximum: 2
                        default: 1
                        description: Adjusts the speed of the voice. A value of 1.0 is the default speed, while values less than 1.0 slow down the speech, and values greater than 1.0 speed it up.
                      vol:
                        type: number
                        minimum: 0.01
                        maximum: 10
                        default: 1
                        description: 'The volume of the generated speech. Range: (0, 10]. Larger values indicate larger volumes.'
                      pitch:
                        type: integer
                        minimum: -12
                        maximum: 12
                        default: 0
                        description: 'The pitch of the generated speech. Range: [-12, 12]. 0 = default voice output.'
                      emotion:
                        type: string
                        enum:
                        - happy
                        - sad
                        - angry
                        - fearful
                        - disgusted
                        - surprised
                        - neutral
                        description: Emotional tone to apply to the synthesized speech. Controls the emotional expression of the generated voice output.
                      text_normalization:
                        type: boolean
                        default: false
                        description: English text normalization support. Improves number-reading but increases latency.
                    default:
                      voice_id: Wise_Woman
                    description: Voice settings overriding stored settings for the given voice. They are applied only on the given request.
                  audio_setting:
                    type: object
                    properties:
                      sample_rate:
                        type: integer
                        description: Audio sample rate in Hz.
                        enum:
                        - 8000
                        - 16000
                        - 22050
                        - 24000
                        - 32000
                        - 44100
                        default: '32000'
                      bitrate:
                        type: integer
                        description: Audio bitrate in bits per second. Controls the compression level and audio quality. Higher bitrates provide better quality but larger file sizes.
                        enum:
                        - 32000
                        - 64000
                        - 128000
                        - 256000
                        default: '128000'
                      format:
                        type: string
                        enum:
                        - mp3
                        - pcm
                        - flac
                        default: mp3
                        description: Audio output format. MP3 provides good compression and compatibility, PCM offers uncompressed high quality, and FLAC provides lossless compression.
                      channel:
                        type: integer
                        description: Number of audio channels. 1 for mono (single channel), 2 for stereo (dual channel) output.
                        enum:
                        - 1
                        - 2
                        default: '1'
                    description: Audio output configuration
                  pronunciation_dict:
                    type: object
                    properties:
                      tone:
                        type: array
                        items:
                          type: string
                        description: 'Replacement of text and pronunciations. Format: ["燕少飞/(yan4)(shao3)(fei1)", "达菲/(da2)(fei1)", "omg/oh my god"]'
                    required:
                    - tone
                    description: Custom pronunciation dictionary for handling specific words or phrases. Allows fine-tuning of how certain text should be pronounced using phonetic representations.
                  timbre_weights:
                    type: array
                    items:
                      type: object
                      properties:
                        voice_id:
                          anyOf:
                          - type: string
                            enum:
                            - Wise_Woman
                            - Friendly_Person
                            - Inspirational_girl
                            - Deep_Voice_Man
                            - Calm_Woman
                            - Casual_Guy
                            - Lively_Girl
                            - Patient_Man
                            - Young_Knight
                            - Determined_Man
                            - Lovely_Girl
                            - Decent_Boy
                            - Imposing_Manner
                            - Elegant_Man
                            - Abbess
                            - Sweet_Girl_2
                            - Exuberant_Girl
                          - type: string
                            minLength: 1
                            maxLength: 64
                          description: A predefined system voice for text-to-speech synthesis.
                        weight:
                          type: integer
                          minimum: 1
                          maximum: 100
                          description: 'Weight for voice mixing. Range: [1, 100]. Higher weights are sampled more heavily.'
                      required:
                      - voice_id
                      - weight
                    maxItems: 4
                    description: Voice mixing configuration allowing combination of up to 4 different voices with specified weights. Each voice contributes to the final output based on its weight value (1-100).
                  language_boost:
                    type: string
                    enum:
                    - Chinese
                    - Chinese,Yue
                    - English
                    - Arabic
                    - Russian
                    - Spanish
                    - French
                    - Portuguese
                    - German
                    - Turkish
                    - Dutch
                    - Ukrainian
                    - Vietnamese
                    - Indonesian
                    - Japanese
