                    - '#g1_aura-orpheus-en'
                    - aura-helios-en
                    - deepgram/aura-helios-en
                    - '#g1_aura-helios-en'
                  text:
                    type: string
                    description: The text content to be converted to speech.
                  container:
                    type: string
                    description: The file format wrapper for the output audio. The available options depend on the encoding type.
                  encoding:
                    type: string
                    enum:
                    - linear16
                    - mulaw
                    - alaw
                    - mp3
                    - opus
                    - flac
                    - aac
                    default: linear16
                    description: Specifies the expected encoding of your audio output
                  sample_rate:
                    type: string
                    description: Audio sample rate in Hz.
                  stream:
                    type: boolean
                    default: true
                  voice:
                    type: string
                    enum:
                    - asteria
                    - hera
                    - luna
                    - stella
                    - athena
                    - zeus
                    - orion
                    - arcas
                    - perseus
                    - angus
                    - orpheus
                    - helios
                    description: Name of the voice to be used.
                required:
                - model
                - text
                title: 'aura, deepgram/aura, aura-asteria-en, deepgram/aura-asteria-en, #g1_aura-asteria-en, aura-hera-en, deepgram/aura-hera-en, #g1_aura-hera-en, aura-luna-en, deepgram/aura-luna-en, #g1_aura-luna-en, aura-stella-en, deepgram/aura-stella-en, #g1_aura-stella-en, aura-athena-en, deepgram/aura-athena-en, #g1_aura-athena-en, aura-zeus-en, deepgram/aura-zeus-en, #g1_aura-zeus-en, aura-orion-en, deepgram/aura-orion-en, #g1_aura-orion-en, aura-arcas-en, deepgram/aura-arcas-en, #g1_aura-arcas-en, aura-perseus-en, deepgram/aura-perseus-en, #g1_aura-perseus-en, aura-angus-en, deepgram/aura-angus-en, #g1_aura-angus-en, aura-orpheus-en, deepgram/aura-orpheus-en, #g1_aura-orpheus-en, aura-helios-en, deepgram/aura-helios-en, #g1_aura-helios-en'
              - type: object
                properties:
                  model:
                    type: string
                    enum:
                    - aura-2
                    - deepgram/aura-2
                    - aura-2-amalthea-en
