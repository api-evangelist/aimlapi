findings:
- No security.txt is served on any AIMLAPI host, so there is no machine-readable
  vulnerability-disclosure contact.
- >-
  aimlapi.com answers every /.well-known/* path with an 88-byte HTML body reading
  "Invalid .well-known request" under a 404 status — an explicit handler, not a
  generic miss, so the absence is deliberate rather than accidental.
- >-
  api.aimlapi.com answers every miss with RFC 9457 application/problem+json,
  which is itself a useful signal about the API's error envelope.
