description: AIMLAPI is a unified AI model API gateway providing access to 400+ state-of-the-art
  AI models from OpenAI, Anthropic, Google, Meta, DeepSeek, Mistral, Stability AI,
  and 40+ other providers through a single OpenAI-compatible API. Supported modalities
  include text/chat LLMs, image generation, video generation, music generation, speech-to-text,
  text-to-speech, vision/OCR, embeddings, and 3D generation.
