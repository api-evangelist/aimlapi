- type: Features
  data:
  - name: 400+ AI Models
    description: Access to 400+ models from OpenAI, Anthropic, Google, Meta, DeepSeek,
      Mistral, Stability AI, and 40+ providers.
  - name: OpenAI-Compatible API
    description: Drop-in replacement for OpenAI API — use existing OpenAI client libraries
      with AIMLAPI endpoint.
  - name: Text and Chat Completions
    description: Chat completions, completion, function calling, streaming, reasoning,
      and code generation.
  - name: Image Generation
    description: Generate images via DALL-E, Flux, Stable Diffusion, and other image
      generation models.
  - name: Video Generation
    description: Generate video via Sora 2, Runway, and other video generation models.
  - name: Speech Models
    description: Text-to-speech and speech-to-text transcription via Whisper and other
      speech models.
  - name: Music Generation
    description: AI music generation via dedicated music models.
  - name: Vision and OCR
    description: Image understanding, visual question answering, and OCR via vision-capable
      LLMs.
  - name: Embeddings
    description: Generate vector embeddings for semantic search and RAG applications.
  - name: Playground
    description: Online playground for experimenting with all available models without
      writing code.
- type: UseCases
  data:
  - name: AI Chatbot Development
    description: Build conversational AI chatbots and virtual assistants using leading
      LLMs.
  - name: Content Generation
    description: Automate text, image, video, and music content generation for media
      and marketing.
  - name: RAG Applications
    description: Build retrieval-augmented generation applications using embeddings
      and LLMs.
  - name: Code Generation
    description: Integrate AI code generation and review capabilities into developer
      tools.
  - name: Document Processing
    description: Extract information and summarize documents using vision and LLM
      models.
  - name: Voice Applications
    description: Add speech-to-text transcription and text-to-speech synthesis to
      applications.
- type: Integrations
  data:
  - name: OpenAI SDK
    description: Use the official OpenAI Python and Node.js SDKs with AIMLAPI base
      URL.
  - name: LangChain
    description: Integrate AIMLAPI models with LangChain for agentic AI workflows.
  - name: LlamaIndex
    description: Use AIMLAPI with LlamaIndex for RAG and document intelligence pipelines.
  - name: Vercel AI SDK
    description: Build AI-powered web apps using Vercel AI SDK with AIMLAPI as backend.
  - name: Python
    description: Native Python integration via requests library or OpenAI client.
  - name: Node.js
    description: Node.js integration via OpenAI npm package pointed at AIMLAPI endpoint.
