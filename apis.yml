- aid: aimlapi:aimlapi-api-key-management-api
  name: AIMLAPI API Key Management API
  description: "## **Creating an API Key**\n\nTo create a new API key Sign-ip to [app.aimlapi.com](https://app.aimlapi.com),\
    \ navigate to Key Management page and create an API Key\n\nNote that your Keys only work with an Active\
    \ Subscription\n\n## **Disabling an API Key**\n\nIf you need to revoke access temporarily, disable\
    \ an API key by:\n\n- Sending a PUT request to `/service/api-keys/{id}/disable`, replacing `{id}`\
    \ with the key's unique identifier.\n    \n- This will change the key's status to inactive.\n    \n\
    \n## **Enabling an API Key**\n\nTo restore access using a previously disabled API key:\n\n- Send a\
    \ PUT request to `/service/api-keys/{id}/enable`, replacing `{id}` with the key's unique identifier.\n\
    \    \n- The key's status will be updated to active.\n    \n\n## **Best Practices**\n\n- Regularly\
    \ review and manage your API keys to ensure optimal security.\n    \n- Use separate keys for different\
    \ services or environments to limit the scope of access.\n    \n- Rotate your API keys periodically\
    \ to reduce the risk of unauthorized use.\n    \n\nBy effectively managing your API keys, you maintain\
    \ control over who can access your AI/ML API services and safeguard your resources."
  humanURL: https://aimlapi.com/
