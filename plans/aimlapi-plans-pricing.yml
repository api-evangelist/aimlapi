specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: AIMLAPI
providerId: aimlapi
providerId_note: replaces the 2026-05-04 generated scaffold, which carried invented quotas
created: '2026-05-04'
modified: '2026-08-30'
generated: '2026-08-30'
method: probed
source: https://aimlapi.com/ai-ml-api-pricing
source_detail: >-
  Read from the schema.org JSON-LD block the pricing page serves inline
  (WebPage > about > Service > offers[]). The rendered tier cards are
  client-side JavaScript and carry no prices in the served HTML; the JSON-LD is
  the only machine-readable form of this data the provider publishes.
description: >-
  Six published plans. AIMLAPI sells prepaid token allowances rather than request
  quotas, so the unit attached to every paid tier is millions of tokens, and the
  differentiator between tiers is the bonus-credit percentage and the support
  level rather than a rate limit. Only the Enterprise tier is quote-only.
currency: USD
plan_count: 6
plans:
- id: developer
  name: Developer Plan
  price: 0
  currency: USD
  period: null
  type: free
  included_quota: 10M tokens
  entries:
  - label: Tokens
    metric: tokens
    limit: 10000000
  features:
  - community access
  - 24/7 support
  description: >-
    Free plan with 10M tokens, community access, and 24/7 support for building
    prototypes and MVPs.
- id: startup
  name: Startup Plan
  price: 0
  currency: USD
  period: null
  type: pay-as-you-go
  unit_text: Pay As You Go
  included_quota: from 40M tokens
  entries:
  - label: Tokens
    metric: tokens
    limit: 40000000
    note: starting allowance; usage-based beyond it
  features:
  - access to 1000+ models
  - priority support
  description: >-
    Pay-as-you-go plan starting from 40M tokens with access to 1000+ models and
    priority support.
- id: production
  name: Production Plan
  price: 50
  currency: USD
  period: month
  type: subscription
  included_quota: 100M tokens
  entries:
  - label: Tokens
    metric: tokens
    limit: 100000000
    timeFrame: month
  features:
  - priority support
  - fixed pricing
  - 10% bonus credits
  description: >-
    Production plan with 100M tokens, priority support, fixed pricing, and 10%
    bonus credits.
- id: pay-in-crypto
  name: Pay In Crypto Plan
  price: 100
  currency: USD
  period: month
  type: subscription
  included_quota: 200M tokens
  entries:
  - label: Tokens
    metric: tokens
    limit: 200000000
    timeFrame: month
  features:
  - personal support
  - 25% bonus credits
  - crypto payment
  description: >-
    Crypto payment plan starting at $100/month with 200M tokens, personal
    support, and 25% bonus credits.
- id: scale
  name: Scale Plan
  price: 200
  currency: USD
  period: month
  type: subscription
  included_quota: 400M tokens
  entries:
  - label: Tokens
    metric: tokens
    limit: 400000000
    timeFrame: month
  features:
  - personal support
  - enterprise-grade infrastructure
  - 20% bonus credits
  description: >-
    Scale plan with 400M tokens, personal support, enterprise-grade
    infrastructure, and 20% bonus credits.
- id: enterprise
  name: Enterprise Plan
  price: null
  currency: USD
  period: null
  type: custom
  included_quota: null
  features:
  - special pricing
  - dedicated servers
  - custom models
  - unlimited RPM/TPM
  - full staff training
  - joint marketing
  - shared Slack channel
  - extended data storage
  description: >-
    Custom enterprise solution. The only tier where limits are described as
    unlimited, which by implication means the other five ARE rate-limited — but
    no tier publishes its RPM or TPM number.
usage_based_pricing:
  model: per-token, per-model
  note: >-
    Headline per-model prices are published on the pricing page and in the
    catalogue itself. GET /v1/models exposes price data as an opt-in section, so
    per-model pricing is machine-readable without a key.
  examples_from_page:
  - model: Anthropic / Claude 4.5 Opus
    price: 5.25
    unit: per 1M input tokens
  - model: OpenAI / GPT-5.1
    price: 1.3125
    unit: per 1M input tokens
  - model: Google / Gemini 3 Pro Preview
    price: 4.2
    unit: per 1M input tokens
spend_controls:
  per_key_limit: true
  note: >-
    A spending threshold in USD can be attached to each API key with a retention
    period of no_reset, day, week or month; resets happen at 00:00 UTC. Charges
    on that key are blocked once the threshold is reached.
  docs: https://docs.aimlapi.com/faq/how-can-i-work-with-my-api-keys
  api: POST /v1/keys — limit.retention, limit.threshold
free_tier:
  status: paused
  source: https://docs.aimlapi.com/faq/free-tier
  note: >-
    The FAQ page for the Free Tier reads, in its entirety, "The Free Tier is
    currently paused." The pricing page still advertises a $0 Developer Plan with
    10M tokens, so the two surfaces disagree about whether free access exists.
billing_api:
- GET /v2/billing — balance
- GET /v2/billing/detail
- GET /v2/billing/transactions
- GET /v2/usage
- GET /v2/logs
