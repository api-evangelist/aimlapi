observations:
- >-
  Every entry is a model addition, a billing change or a fix. Not one entry
  records an API contract change — a new endpoint, a changed field, a removed
  parameter — even though /v2 endpoints, the batch surface, the OCR endpoint, the
  usage-logs API and the MCP server all appeared after the last entry.
- >-
  The live record of change is elsewhere: GET /v1/models/deprecations carries 132
  dated retirement entries, the newest from 2026-08-27. An integration that needs
  to track AIMLAPI should poll the feed, not read the changelog.
