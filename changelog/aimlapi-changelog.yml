description: >-
  AIMLAPI publishes a dated, public changelog page. It is stale: the newest entry
  is 12 February 2025, roughly eighteen months before this probe, while the
  product plainly kept moving — the site footer advertises models the changelog
  never mentions and the deprecation feed recorded retirements as recently as
  27 August 2026. Recorded honestly, including the staleness, because a
  changelog nobody updates is worse than none for an integrator trying to decide
  whether a behaviour changed.
